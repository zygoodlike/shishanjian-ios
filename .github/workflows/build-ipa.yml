name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -project Shishanjian.xcodeproj -list

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Shishanjian.xcodeproj \
            -scheme Shishanjian \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -archivePath "$RUNNER_TEMP/Shishanjian.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/build.log"
          # Keep the log readable in the Actions summary
          tail -n 200 "$RUNNER_TEMP/build.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/Shishanjian.xcarchive/Products/Applications/Shishanjian.app"
          if [ ! -d "$APP" ]; then
            echo "::error::App bundle not found at $APP"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Shishanjian-unsigned.ipa Payload
          ls -lh Shishanjian-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Shishanjian-unsigned-ipa
          path: Shishanjian-unsigned.ipa
          retention-days: 14
